name: ai-implement
on:
  issues:
    types: [labeled]
  issue_comment: # `/ai ...` on a PR: revise the same branch
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue: { description: issue number, required: true }
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # gh workflow run preview.yml
concurrency:
  group: ai-implement-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}
jobs:
  implement:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.label.name == 'ai-implement'
      || (startsWith(github.event.comment.body, '/ai')
          && github.event.comment.user.type != 'Bot'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres: # the agent starts `pnpm dev` inside its container and checks the UI with agent-browser
        image: postgres:17-alpine
        env: { POSTGRES_USER: orchat, POSTGRES_PASSWORD: orchat, POSTGRES_DB: orchat }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve target # sets MODE (new | followup | plan) / N (issue) / PR / BRANCH / REF for the steps below
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          IS_PR: ${{ (github.event.issue.pull_request || github.event.pull_request) && 'yes' || '' }}
          REACT: ${{ github.event_name == 'issue_comment' && 'issues' || 'pulls' }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          N: ${{ github.event.issue.number || inputs.issue }}
        run: |
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$GH_REPO/$REACT/comments/$COMMENT_ID/reactions" -f content=eyes --silent # ack: the run takes minutes
          fi
          if [ -n "$COMMENT_ID" ] && [ -z "$IS_PR" ]; then # `/ai` on a plain issue: write/revise the plan in the issue body, no code
            printf 'MODE=plan\nN=%s\nPR=\nBRANCH=\nREF=%s\n' "$N" "$GITHUB_REF" >> "$GITHUB_ENV"
          elif [ -n "$COMMENT_ID" ]; then
            BRANCH=$(gh pr view "$PR" --json headRefName -q .headRefName)
            case "$BRANCH" in ai/issue-*) N=${BRANCH#ai/issue-};; *) N=;; esac # hand-made PR: no issue context
            printf 'MODE=followup\nN=%s\nPR=%s\nBRANCH=%s\nREF=refs/heads/%s\n' "$N" "$PR" "$BRANCH" "$BRANCH" >> "$GITHUB_ENV"
          else
            printf 'MODE=new\nN=%s\nPR=\nBRANCH=ai/issue-%s\nREF=%s\n' "$N" "$N" "$GITHUB_REF" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        with: { ref: "${{ env.REF }}", persist-credentials: false, fetch-depth: 0 } # the agent container sees .git; keep the token out of it
      - name: Merge main into the PR branch (followup) # conflicts are left as markers for the agent to resolve
        if: env.MODE == 'followup'
        run: |
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" main # URL form: nothing persisted in .git
          git merge --no-commit --no-ff FETCH_HEAD || true # --no-commit: MERGE_HEAD stays, the commit step below concludes it
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt
      - name: Build prompt
        env: # comment fields go through env, never into the shell text (injection)
          C_USER: ${{ github.event.comment.user.login }}
          C_BODY: ${{ github.event.comment.body }}
          C_PATH: ${{ github.event.comment.path }}
          C_LINE: ${{ github.event.comment.line || github.event.comment.original_line }}
          C_HUNK: ${{ github.event.comment.diff_hunk }}
        run: |
          {
            if [ "$MODE" = plan ]; then
              echo "Write an implementation plan for the GitHub issue below. Do NOT change any file in the repository other than PLAN.md; do not touch git."
              echo "Read AGENTS.md first, then actually read the code the issue touches (do not guess from file names)."
              echo "Write the plan to \`/work/PLAN.md\` (Markdown, same language as the issue, no title, sub-headings as \`###\` or lower) with these sections:"
              echo "approach, files to change (path + one line each), acceptance criteria, open questions for the human (empty if none)."
              echo "Keep it as short as possible: the smallest change that fully resolves the issue, no speculative work."
              echo "If the issue already has a \`## Plan\` section, treat it as the previous version and rewrite it applying the request below and the thread."
              echo "Tools: \`websearch\` / \`webfetch\` are available for docs and APIs."
              echo
              echo "# Request by @$C_USER"
              printf '%s\n\n' "$(R=${C_BODY#/ai}; [ -n "${R// /}" ] && echo "$R" || echo "(none: write the initial plan)")"
            else
              if [ "$MODE" = new ]; then
                echo "Implement the GitHub issue below in this repository. If the issue has a \`## Plan\` section, follow it."
              else
                echo "Address the review comment below on the open pull request #$PR in this repository."
                echo "The branch already contains the previous implementation; change only what the comment asks."
              fi
              echo "Rules: read AGENTS.md first. Make the smallest change that fully resolves the request."
              echo "Run \`pnpm check\` and fix errors until it passes. Do not commit; do not touch git."
              echo "Do not edit .env*, dev/, drizzle/, Dockerfile, compose.yaml, .github/, deploy/, opencode.json."
              echo "Do not add dependencies unless explicitly asked. Keep the diff minimal; no drive-by refactors."
              echo "pnpm's 'Ignored build scripts' warning is expected: do not run approve-builds or create pnpm-workspace.yaml."
              echo "Tools: \`websearch\` / \`webfetch\` are available for docs and APIs."
              echo "To verify UI changes in a real browser: \`pnpm dev > /tmp/dev.log 2>&1 &\`, wait until http://localhost:5174 responds,"
              echo "run \`agent-browser skills get core\` once to learn the CLI, then \`agent-browser open http://localhost:5174\` (Postgres is running; you are logged in automatically as DEV_USER)."
              echo "Before finishing: \`agent-browser close --all\` and stop the dev server (\`pkill -f '[c]oncurrently'\`)."
              echo
            fi
            if [ "$MODE" = followup ]; then
              echo "# Review comment by @$C_USER"
              if [ -n "$C_PATH" ]; then printf 'File: %s (line %s)\n\n```diff\n%s\n```\n\n' "$C_PATH" "$C_LINE" "$C_HUNK"; fi
              printf '%s\n\n' "${C_BODY#/ai}"
              if [ -s /tmp/conflicts.txt ]; then
                printf '# Merge conflicts\nmain was merged into this branch; these files still contain conflict markers (<<<<<<< / ======= / >>>>>>>).\nResolve them keeping the intent of both sides and remove every marker:\n%s\n\n' "$(cat /tmp/conflicts.txt)"
              fi
              printf '# Current PR diff\n\n```diff\n'
              gh pr diff "$PR" | head -c 40000
              printf '\n```\n\n'
            fi
            if [ -n "$N" ]; then gh issue view "$N" --json title,body -q '"# Issue #'"$N"': " + .title + "\n\n" + .body'; fi
            if [ "$MODE" = plan ]; then # the thread holds the human's answers to earlier open questions
              printf '\n# Issue thread (oldest first)\n\n'
              gh api "repos/$GH_REPO/issues/$N/comments" -q '.[] | "## @" + .user.login + " (" + .created_at + ")\n\n" + .body + "\n"' | head -c 30000
            fi
          } > /tmp/prompt.md
          {
            echo "DATABASE_URL=postgres://orchat:orchat@localhost:5432/orchat"
            echo "DEV_USER=ai-agent@example.com"
            echo "BASE_URL=http://localhost:5174"
            echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}"
          } > /tmp/agent.env
      - name: Run agent in container (no GITHUB_TOKEN, no docker socket)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -o pipefail # tee must not mask the agent's exit code
          # playwright image = node 24 + chromium + its system libs; --network host reaches the postgres service
          docker run --rm --init --ipc=host --network host --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_prefix=/tmp/npm -e npm_config_store_dir=/tmp/pnpm-store -e OPENCODE_API_KEY \
            -v "$PWD:/work" -v /tmp/prompt.md:/prompt.md:ro -v /tmp/agent.env:/work/.env:ro -w /work \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            bash -c 'export PATH=/tmp/npm/bin:$PATH AGENT_BROWSER_EXECUTABLE_PATH=$(ls /ms-playwright/chromium-*/chrome-linux*/chrome | head -1) \
              && npm i -g pnpm@10 opencode-ai@1.18.30 agent-browser@0.37.1 >/dev/null \
              && pnpm install --frozen-lockfile >/dev/null && opencode run < /prompt.md' | tee /tmp/agent.log # stdin, not argv: `pkill -f <word in prompt>` would kill this shell
      - name: Write the plan into the issue body (plan) # everything above the `## Plan` heading is the human's text and is kept
        if: env.MODE == 'plan'
        run: |
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [ -s PLAN.md ] || { gh issue comment "$N" -b "ai-implement: agent produced no plan (PLAN.md missing). Run: $RUN"; exit 1; }
          gh issue view "$N" --json body -q .body | tr -d '\r' | awk '/^## Plan[[:space:]]*$/{exit} {print}' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > /tmp/body.md # drop the previous plan and trailing blank lines
          { printf '\n## Plan\n\n'; sed '/^## Plan[[:space:]]*$/d' PLAN.md; } >> /tmp/body.md
          gh issue edit "$N" --body-file /tmp/body.md
          gh issue comment "$N" -b "ai-implement: plan written to the issue body under \`## Plan\` (keep your own text above that heading). Run: $RUN
          Reply \`/ai <feedback>\` to revise it, or add the \`ai-implement\` label to implement it."
      - name: Enforce off-limits paths, bail if no changes
        if: env.MODE != 'plan'
        run: |
          rm -rf node_modules pnpm-workspace.yaml
          git checkout -- .github deploy AGENTS.md CLAUDE.md opencode.json && git clean -fd .github deploy
          if [ -z "$(git status --porcelain)" ]; then
            # no diff = the agent's final message is the deliverable; the tail of the log is roughly that message
            # issues/{n}/comments works for issues and PRs alike
            gh api "repos/$GH_REPO/issues/${PR:-$N}/comments" --silent -f body="$(printf 'ai-implement: agent produced no changes. %s\n\n<details><summary>agent output (tail)</summary>\n\n```\n%s\n```\n</details>' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$(tail -c 6000 /tmp/agent.log | sed 's/\x1b\[[0-9;]*m//g')")"
            exit 1
          fi
      - name: Commit, then merge main if it merges cleanly # main may have moved while the agent ran (up to 45 min)
        if: env.MODE != 'plan'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if [ "$MODE" = followup ]; then MSG="AI: address review comment on #$PR"; else MSG="AI: implement #$N"; fi
          git commit -qm "$MSG" # with MERGE_HEAD present (followup) this is the merge commit itself; the merge below is then a no-op
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" main
          git merge --no-ff -m "Merge main into $BRANCH" FETCH_HEAD \
            || { git merge --abort; echo "CONFLICT=1" >> "$GITHUB_ENV"; } # nobody left to resolve it: ship as-is, ask for /ai
      - uses: pnpm/action-setup@v4
        if: env.MODE != 'plan'
        with: { version: 10 }
      - uses: actions/setup-node@v4
        if: env.MODE != 'plan'
        with: { node-version: 24, cache: pnpm }
      - name: Gate
        if: env.MODE != 'plan'
        id: gate
        continue-on-error: true
        run: pnpm install --frozen-lockfile && pnpm check
      - name: Push branch, then open draft PR or report on the existing one
        if: env.MODE != 'plan'
        env:
          STATUS: ${{ steps.gate.outcome == 'success' && 'passed' || 'FAILED' }}
          C_URL: ${{ github.event.comment.html_url }}
          NOTE: ${{ env.CONFLICT == '1' && '⚠ Conflicts with main; reply `/ai merge main and resolve the conflicts` to fix.' || '' }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$MODE" = followup ]; then
            git push "$REMOTE" "HEAD:refs/heads/$BRANCH" # no --force: never drop commits a human pushed meanwhile
            gh pr comment "$PR" -b "ai-implement: pushed $(git rev-parse --short HEAD) for $C_URL. \`pnpm check\` on runner: **$STATUS**. Run: $RUN $NOTE"
          else
            git switch -c "$BRANCH"
            git push --force "$REMOTE" "HEAD:refs/heads/$BRANCH"
            gh pr create --draft --label preview --head "$BRANCH" \
              --title "AI: $(gh issue view "$N" --json title -q .title)" \
              --body "Closes #$N

          Generated by opencode from the issue. \`pnpm check\` on runner: **$STATUS**. $NOTE
          Run: $RUN

          Reply \`/ai <request>\` on this PR (conversation or inline) to have the branch revised.
          A preview URL is commented by the \`preview\` workflow (tailnet only)." \
              || echo "PR already exists; branch updated"
            PR=$(gh pr view "$BRANCH" --json number -q .number)
          fi
          # pushes / labels made with GITHUB_TOKEN never fire pull_request events, so start the preview by hand
          if gh pr view "$PR" --json labels -q '.labels[].name' | grep -qx preview; then
            gh workflow run preview.yml -f pr="$PR"
          fi
          [ "$STATUS" = passed ]
